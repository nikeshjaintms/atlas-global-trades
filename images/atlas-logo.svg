<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 180" width="500" height="180">
  <defs>
    <!-- Wireframe Globe -->
    <g id="globe" stroke="#9c9c9c" stroke-width="1.5" fill="none">
      <circle cx="250" cy="70" r="45" />
      <!-- Vertical curves -->
      <ellipse cx="250" cy="70" rx="15" ry="45" />
      <ellipse cx="250" cy="70" rx="30" ry="45" />
      <line x1="250" y1="25" x2="250" y2="115" />
      <!-- Horizontal curves -->
      <line x1="205" y1="70" x2="295" y2="70" />
      <ellipse cx="250" cy="70" rx="45" ry="15" />
      <ellipse cx="250" cy="70" rx="45" ry="30" />
    </g>
  </defs>

  <!-- Globe in background -->
  <use href="#globe" />

  <!-- ATLAS text -->
  <text x="250" y="115" font-family="Georgia, 'Times New Roman', serif" font-size="86" font-weight="bold" fill="#555555" text-anchor="middle" letter-spacing="4">ATLAS</text>

  <!-- Divider Line -->
  <line x1="90" y1="135" x2="410" y2="135" stroke="#a59a8f" stroke-width="2" />

  <!-- Subtitle text -->
  <text x="250" y="160" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#777777" text-anchor="middle" letter-spacing="1">GLOBAL TRADERS L.L.C-FZ</text>
</svg>
